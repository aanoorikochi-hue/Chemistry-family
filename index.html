<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمایشگاه شیمی</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #00d9ff;
    --bg-dark: #0a0e27;
    --bg-card: #151a35;
    --text: #e8eef7;
    --text-dim: #8892b0;
    --success: #00ff88;
    --danger: #ff4757;
    --warning: #ffa502;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: var(--bg-dark);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,217,255,0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(157,78,221,0.08) 0%, transparent 50%);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
    direction: rtl;
  }

  .header {
    text-align: center;
    margin-bottom: 30px;
    padding: 20px;
  }

  .header h1 {
    font-size: 2.5em;
    background: linear-gradient(135deg, var(--primary), #9d4edd);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
    font-weight: 800;
  }

  .header p { color: var(--text-dim); font-size: 1em; }

  .tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 30px;
    flex-wrap: wrap;
    background: var(--bg-card);
    padding: 8px;
    border-radius: 50px;
    max-width: fit-content;
    margin-left: auto;
    margin-right: auto;
    border: 1px solid rgba(0,217,255,0.15);
  }

  .tab-btn {
    padding: 12px 28px;
    background: transparent;
    color: var(--text-dim);
    border: none;
    border-radius: 40px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    transition: all 0.3s;
    font-family: inherit;
    white-space: nowrap;
  }

  .tab-btn:hover {
    color: var(--text);
    background: rgba(0,217,255,0.08);
  }

  .tab-btn.active {
    background: linear-gradient(135deg, var(--primary), #9d4edd);
    color: white;
    box-shadow: 0 4px 20px rgba(0,217,255,0.4);
  }

  .section { display: none; }
  .section.active {
    display: block;
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .lab-container {
    max-width: 1000px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1.5fr;
    gap: 30px;
    align-items: start;
  }

  @media (max-width: 768px) {
    .lab-container { grid-template-columns: 1fr; }
    .header h1 { font-size: 1.8em; }
  }

  .beaker-side {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: sticky;
    top: 20px;
  }

  .beaker {
    position: relative;
    width: 220px;
    height: 280px;
    margin: 20px auto;
  }

  .beaker-glass {
    position: absolute;
    bottom: 0;
    width: 220px;
    height: 260px;
    border: 5px solid rgba(168,218,220,0.6);
    border-top: none;
    border-radius: 0 0 25px 25px;
    background: rgba(255,255,255,0.03);
    box-shadow: inset 0 0 30px rgba(0,217,255,0.15), 0 10px 40px rgba(0,0,0,0.5);
    overflow: hidden;
  }

  .beaker-glass::before {
    content: '';
    position: absolute;
    top: 20px;
    left: 15px;
    width: 15px;
    height: 100px;
    background: linear-gradient(to bottom, rgba(255,255,255,0.4), transparent);
    border-radius: 10px;
    z-index: 5;
    pointer-events: none;
  }

  .water {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 65%;
    background: linear-gradient(180deg, #4fc3f7 0%, #0288d1 100%);
    transition: background 1s ease;
    border-radius: 0 0 20px 20px;
  }

  .water::before {
    content: '';
    position: absolute;
    top: -10px;
    left: 0;
    width: 100%;
    height: 20px;
    background: inherit;
    border-radius: 50%;
    opacity: 0.8;
  }

  .bubbles {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 3;
  }

  .bubble {
    position: absolute;
    background: rgba(255,255,255,0.7);
    border-radius: 50%;
    animation: rise 2s infinite;
    box-shadow: inset 0 0 5px rgba(255,255,255,0.5);
  }

  @keyframes rise {
    0% { transform: translateY(0) scale(1); opacity: 0.9; }
    100% { transform: translateY(-200px) scale(0.5); opacity: 0; }
  }

  .result-text {
    margin-top: 20px;
    font-size: 15px;
    min-height: 50px;
    color: var(--primary);
    font-weight: 600;
    text-align: center;
    padding: 12px 20px;
    background: var(--bg-card);
    border-radius: 15px;
    border: 1px solid rgba(0,217,255,0.15);
    transition: all 0.3s;
    width: 100%;
    max-width: 300px;
  }

  .compound-list {
    background: var(--bg-card);
    border-radius: 20px;
    padding: 25px;
    border: 1px solid rgba(0,217,255,0.1);
  }

  .compound-list h3 {
    color: var(--primary);
    margin-bottom: 20px;
    font-size: 1.2em;
  }

  .compounds {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }

  .compound-btn {
    padding: 18px 12px;
    border-radius: 15px;
    border: 2px solid rgba(255,255,255,0.15);
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
    transition: all 0.3s;
    color: #fff;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
    font-family: inherit;
    position: relative;
    overflow: hidden;
  }

  .compound-btn:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    border-color: white;
  }

  .compound-btn small {
    display: block;
    opacity: 0.9;
    font-size: 11px;
    margin-top: 4px;
    font-weight: 400;
  }

  .reset-btn {
    padding: 12px 30px;
    background: linear-gradient(135deg, var(--danger), #c92a2a);
    color: #fff;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    transition: all 0.3s;
    display: block;
    margin: 0 auto;
  }

  .reset-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 5px 20px rgba(255,71,87,0.4);
  }

  .calculator {
    max-width: 600px;
    margin: 0 auto;
    background: var(--bg-card);
    border-radius: 20px;
    padding: 30px;
    border: 1px solid rgba(0,217,255,0.1);
  }

  .calculator h2 {
    color: var(--primary);
    margin-bottom: 20px;
    text-align: center;
  }

  .calc-input {
    width: 100%;
    padding: 15px 20px;
    background: var(--bg-dark);
    border: 2px solid rgba(0,217,255,0.2);
    border-radius: 12px;
    color: var(--text);
    font-size: 18px;
    font-family: inherit;
    outline: none;
    margin-bottom: 15px;
    transition: all 0.3s;
    direction: ltr;
    text-align: center;
  }

  .calc-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(0,217,255,0.15);
  }

  .calc-btn {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, var(--primary), #9d4edd);
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    transition: all 0.3s;
  }

  .calc-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0,217,255,0.4);
  }

  .calc-result {
    margin-top: 20px;
    padding: 20px;
    background: var(--bg-dark);
    border-radius: 12px;
    border: 1px solid rgba(0,217,255,0.2);
    text-align: center;
    font-size: 16px;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
  }

  .calc-result .value {
    font-size: 28px;
    font-weight: 800;
    color: var(--success);
  }

  .hint {
    color: var(--text-dim);
    font-size: 12px;
    text-align: center;
    margin-top: 10px;
  }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg-dark); }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(135deg, var(--primary), #9d4edd);
    border-radius: 10px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>🧪 آزمایشگاه شیمی</h1>
  <p>آزمایشگاه مجازی انحلال + ماشین‌حساب جرم مولی</p>
</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="lab" type="button">💧 آزمایشگاه</button>
  <button class="tab-btn" data-tab="calc" type="button">🧮 ماشین‌حساب</button>
</div>

<div id="lab" class="section active">
  <div class="lab-container">
    <div class="beaker-side">
      <div class="beaker">
        <div class="beaker-glass">
          <div class="water" id="water"></div>
          <div class="bubbles" id="bubbles"></div>
        </div>
      </div>
      <div class="result-text" id="resultText">یک ترکیب را انتخاب کنید…</div>
    </div>

    <div class="compound-list">
      <h3>🧴 ترکیب‌های شیمیایی</h3>
      <div class="compounds" id="compounds"></div>
      <button class="reset-btn" id="resetBtn" type="button">🔄 ریست کردن آب</button>
    </div>
  </div>
</div>

<div id="calc" class="section">
  <div class="calculator">
    <h2>🧮 محاسبه‌گر جرم مولی</h2>
    <input type="text" class="calc-input" id="calcInput" placeholder="مثال: H2O یا NaCl یا C6H12O6" dir="ltr">
    <button class="calc-btn" id="calcBtn" type="button">محاسبه جرم مولی</button>
    <div class="calc-result" id="calcResult">
      نتیجه اینجا نمایش داده می‌شود
    </div>
    <p class="hint">💡 فرمول شیمیایی رو با حروف بزرگ/کوچیک درست وارد کن. مثال: H2SO4</p>
  </div>
</div>

<script>
/* ================= آزمایشگاه ================= */
const compounds = [
  { name:'مس(II) سولفات',   formula:'CuSO₄',   color:'#2196f3', desc:'محلول آبی روشن' },
  { name:'پتاسیم دی‌کرومات', formula:'K₂Cr₂O₇', color:'#ff9800', desc:'محلول نارنجی' },
  { name:'پتاسیم پرمنگنات',  formula:'KMnO₄',   color:'#9c27b0', desc:'محلول بنفش' },
  { name:'نیکل(II) کلرید',   formula:'NiCl₂',   color:'#4caf50', desc:'محلول سبز' },
  { name:'کبالت(II) کلرید',  formula:'CoCl₂',   color:'#e91e63', desc:'محلول صورتی' },
  { name:'آهن(III) کلرید',   formula:'FeCl₃',   color:'#a0522d', desc:'محلول قهوه‌ای' },
  { name:'سدیم کلرید',       formula:'NaCl',    color:'#90a4ae', desc:'محلول بی‌رنگ (شور)' },
  { name:'مس(II) کلرید',     formula:'CuCl₂',   color:'#00bcd4', desc:'محلول فیروزه‌ای' },
  { name:'کروم(III) سولفات', formula:'Cr₂(SO₄)₃', color:'#00695c', desc:'محلول سبز تیره' },
  { name:'آهن(II) سولفات',   formula:'FeSO₄',   color:'#66bb6a', desc:'محلول سبز کم‌رنگ' },
  { name:'کلسیم کلرید',      formula:'CaCl₂',   color:'#b0bec5', desc:'محلول بی‌رنگ' },
  { name:'ید',               formula:'I₂',      color:'#795548', desc:'محلول قهوه‌ای' },
];

const compoundsDiv = document.getElementById('compounds');
compounds.forEach(c => {
  const btn = document.createElement('button');
  btn.className = 'compound-btn';
  btn.type = 'button';
  btn.style.background = 'linear-gradient(135deg, ' + c.color + ', ' + shade(c.color, -30) + ')';
  btn.innerHTML = c.name + '<small>' + c.formula + '</small>';
  btn.addEventListener('click', function() { dissolve(c); });
  compoundsDiv.appendChild(btn);
});

function shade(hex, percent) {
  let num = parseInt(hex.replace('#',''),16);
  let r = (num >> 16) + percent;
  let g = ((num >> 8) & 0x00FF) + percent;
  let b = (num & 0x0000FF) + percent;
  r = Math.max(0,Math.min(255,r));
  g = Math.max(0,Math.min(255,g));
  b = Math.max(0,Math.min(255,b));
  return '#' + ((r<<16) | (g<<8) | b).toString(16).padStart(6,'0');
}

function dissolve(compound) {
  const water = document.getElementById('water');
  const resultText = document.getElementById('resultText');

  water.style.background = 'linear-gradient(180deg, ' + compound.color + ', ' + shade(compound.color, -40) + ')';
  resultText.textContent = '✨ ' + compound.name + ' (' + compound.formula + ') حل شد — ' + compound.desc;
  resultText.style.color = compound.color;

  const bubblesDiv = document.getElementById('bubbles');
  bubblesDiv.innerHTML = '';
  for (let i = 0; i < 15; i++) {
    setTimeout(function() {
      const b = document.createElement('div');
      b.className = 'bubble';
      const size = 5 + Math.random() * 15;
      b.style.width = size + 'px';
      b.style.height = size + 'px';
      b.style.left = (5 + Math.random() * 85) + '%';
      b.style.bottom = '0%';
      b.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
      bubblesDiv.appendChild(b);
      setTimeout(function() { b.remove(); }, 3000);
    }, i * 100);
  }
}

function resetWater() {
  const water = document.getElementById('water');
  const resultText = document.getElementById('resultText');
  const bubblesDiv = document.getElementById('bubbles');

  water.style.background = 'linear-gradient(180deg, #4fc3f7 0%, #0288d1 100%)';
  resultText.textContent = 'یک ترکیب را انتخاب کنید…';
  resultText.style.color = 'var(--primary)';
  bubblesDiv.innerHTML = '';
}

/* ================= ماشین‌حساب ================= */
const atomicMasses = {
  H:1.008, He:4.003, Li:6.94, Be:9.012, B:10.81, C:12.01, N:14.01,
  O:16.00, F:19.00, Ne:20.18, Na:22.99, Mg:24.31, Al:26.98, Si:28.09,
  P:30.97, S:32.06, Cl:35.45, Ar:39.95, K:39.10, Ca:40.08, Sc:44.96,
  Ti:47.87, V:50.94, Cr:52.00, Mn:54.94, Fe:55.85, Co:58.93, Ni:58.69,
  Cu:63.55, Zn:65.38, Ga:69.72, Ge:72.63, As:74.92, Se:78.97, Br:79.90,
  Kr:83.80, Rb:85.47, Sr:87.62, Y:88.91, Zr:91.22, Nb:92.91, Mo:95.95,
  Tc:98, Ru:101.1, Rh:102.9, Pd:106.4, Ag:107.9, Cd:112.4, In:114.8,
  Sn:118.7, Sb:121.8, Te:127.6, I:126.9, Xe:131.3, Cs:132.9, Ba:137.3
};

function parseFormula(formula) {
  const regex = /([A-Z][a-z]?)(\d*)/g;
  const result = {};
  let match;
  while ((match = regex.exec(formula)) !== null) {
    const el = match[1];
    const count = match[2] ? parseInt(match[2]) : 1;
    if (!atomicMasses[el]) {
      return { error: 'عنصر "' + el + '" پیدا نشد!' };
    }
    result[el] = (result[el] || 0) + count;
  }
  return result;
}

document.getElementById('calcBtn').addEventListener('click', function() {
  const input = document.getElementById('calcInput').value.trim();
  const resultDiv = document.getElementById('calcResult');

  if (!input) {
    resultDiv.innerHTML = '<span style="color:var(--warning)">⚠️ فرمول را وارد کنید</span>';
    return;
  }

  const parsed = parseFormula(input);
  if (parsed.error) {
    resultDiv.innerHTML = '<span style="color:var(--danger)">❌ ' + parsed.error + '</span>';
    return;
  }

  let total = 0;
  let details = [];
  for (const el in parsed) {
    const mass = atomicMasses[el] * parsed[el];
    total += mass;
    details.push(el + '×' + parsed[el] + ' (' + mass.toFixed(2) + ')');
  }

  resultDiv.innerHTML =
    '<div style="color:var(--text-dim);font-size:12px;margin-bottom:5px">' + input + '</div>' +
    '<div class="value">' + total.toFixed(3) + ' g/mol</div>' +
    '<div style="color:var(--text-dim);font-size:11px;margin-top:8px">' + details.join(' + ') + '</div>';
});

/* ================= تب‌ها ================= */
const tabButtons = document.querySelectorAll('.tab-btn');
tabButtons.forEach(btn => {
  btn.addEventListener('click', function() {
    const target = this.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    this.classList.add('active');
    document.getElementById(target).classList.add('active');
  });
});

/* ================= دکمه‌ها ================= */
document.getElementById('resetBtn').addEventListener('click', resetWater);

document.getElementById('calcInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') {
    document.getElementById('calcBtn').click();
  }
});
</script>
</body>
            </html>
